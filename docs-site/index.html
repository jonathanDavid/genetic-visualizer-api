<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>genetic-visualizer-api — OpenAPI docs</title>
    <link rel="stylesheet" href="swagger-ui.css" />
    <style>
      body { margin: 0; }
      .topbar { display: none; }
      .repo-banner {
        font-family: system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        padding: 0.8rem 1.2rem;
        font-size: 0.9rem;
      }
      .repo-banner a { color: #58a6ff; }
    </style>
  </head>
  <body>
    <div class="repo-banner">
      <strong>genetic-visualizer-api</strong> — Streaming GA backend of the
      <a href="https://github.com/jonathanDavid/genetic-visualizer-api">Genetic-Algorithm Visualizer</a>. Spec
      auto-generated from the FastAPI code on every push (<a href="openapi.json">openapi.json</a>).
    </div>
    <div id="swagger-ui"></div>
    <script src="swagger-ui-bundle.js"></script>
    <script src="swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: 'openapi.json',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        deepLinking: true,
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: false,
      });
    </script>
  </body>
</html>
