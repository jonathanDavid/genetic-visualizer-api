[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-visualizer-api"
version = "1.0.0"
description = "Streaming genetic-algorithm backend for store-item allocation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jonathan Ilias", email = "jdavid.ilias@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "numpy==2.2.1",
    "websockets==14.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.setuptools]
packages = ["app", "app.routers", "ga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
